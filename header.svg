<svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">  
  
<defs>  
  
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">  
  <stop offset="0%" stop-color="#050A14"/>  
  <stop offset="50%" stop-color="#081426"/>  
  <stop offset="100%" stop-color="#030711"/>  
</linearGradient>  
  
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">  
  <stop offset="0%" stop-color="#2563EB"/>  
  <stop offset="50%" stop-color="#60A5FA"/>  
  <stop offset="100%" stop-color="#2563EB"/>  
</linearGradient>  
  
<linearGradient id="text" x1="0" y1="0" x2="1" y2="0">  
  <stop offset="0%" stop-color="#BFDBFE"/>  
  <stop offset="45%" stop-color="#FFFFFF"/>  
  <stop offset="100%" stop-color="#60A5FA"/>  
</linearGradient>  
  
<filter id="glow">  
  <feGaussianBlur stdDeviation="4" result="b"/>  
  <feMerge>  
    <feMergeNode in="b"/>  
    <feMergeNode in="SourceGraphic"/>  
  </feMerge>  
</filter>  
  
<filter id="soft">  
  <feGaussianBlur stdDeviation="10"/>  
</filter>  
  
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">  
  <path d="M40 0H0V40" fill="none" stroke="#60A5FA" stroke-opacity=".055"/>  
</pattern>  
  
<style>  
.msg{  
  font-family:Segoe UI,Inter,Arial,sans-serif;  
  font-size:11px;  
  font-weight:600;  
  letter-spacing:2px;  
  fill:#60A5FA;  
}  
  
.small{  
  font-family:Segoe UI,Inter,Arial,sans-serif;  
  font-size:9px;  
  font-weight:500;  
  letter-spacing:2px;  
  fill:#93C5FD;  
}  
  
.main{  
  font-family:Segoe UI,Inter,Arial,sans-serif;  
  font-size:62px;  
  font-weight:800;  
  letter-spacing:8px;  
  fill:url(#text);  
}  
</style>  
  
</defs>  
  
<rect width="1000" height="300" fill="url(#bg)"/>  
<rect width="1000" height="300" fill="url(#grid)"/> 
<ellipse cx="500" cy="155" rx="360" ry="80" fill="#2563EB" opacity=".08" filter="url(#soft)">  
  <animate attributeName="opacity" values=".04;.11;.04" dur="4s" repeatCount="indefinite"/>  
</ellipse>  
  
<g opacity=".9">  
  <path d="M35 35V18H65" fill="none" stroke="#60A5FA" stroke-width="1.5"/>  
  <path d="M965 35V18H935" fill="none" stroke="#60A5FA" stroke-width="1.5"/>  
  <path d="M35 265V282H65" fill="none" stroke="#60A5FA" stroke-width="1.5"/>  
  <path d="M965 265V282H935" fill="none" stroke="#60A5FA" stroke-width="1.5"/>  
</g>  
  
<g>  
  <text class="msg" x="115" y="75" opacity="0">  
    BUILDING  
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin=".2s" fill="freeze"/>  
    <animateTransform attributeName="transform" type="translate" from="-70 0" to="0 0" dur=".8s" begin=".2s" fill="freeze"/>  
  </text>  
  
  <text class="msg" x="790" y="62" opacity="0">  
    FRONTEND/FULLSTACK
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".6s" fill="freeze"/>  
    <animateTransform attributeName="transform" type="translate" from="70 -25" to="0 0" dur=".8s" begin=".6s" fill="freeze"/>  
  </text>  
  
  <text class="msg" x="70" y="225" opacity="0">  
    REACT  
    <animate attributeName="opacity" values="0;1" dur=".5s" begin="1s" fill="freeze"/>  
    <animateTransform attributeName="transform" type="translate" from="-50 20" to="0 0" dur=".7s" begin="1s" fill="freeze"/>  
  </text>  
  
  <text class="msg" x="820" y="220" opacity="0">  
    WEB DEVELOPMENT  
    <animate attributeName="opacity" values="0;1" dur=".5s" begin="1.4s" fill="freeze"/>  
    <animateTransform attributeName="transform" type="translate" from="65 20" to="0 0" dur=".8s" begin="1.4s" fill="freeze"/>  
  </text>  
  
  <text class="small" x="285" y="55" opacity="0">
    HTML • CSS • JS • TS
    <animate attributeName="opacity" values="0;1" dur=".5s" begin="1.8s" fill="freeze"/>  
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="0 0" dur=".7s" begin="1.8s" fill="freeze"/>  
  </text>  
  
  <text class="small" x="615" y="245" opacity="0">  
    SOFTWARE ENGINEERING  
    <animate attributeName="opacity" values="0;1" dur=".5s" begin="2.1s" fill="freeze"/>  
    <animateTransform attributeName="transform" type="translate" from="0 30" to="0 0" dur=".7s" begin="2.1s" fill="freeze"/>  
  </text>  
</g>  
  
<line x1="340" y1="150" x2="660" y2="150" stroke="#60A5FA" stroke-width="1" opacity="0">  
  <animate attributeName="opacity" values="0;.15;0" dur="2.5s" begin="2.2s" fill="freeze"/>  
</line>  

<g transform="translate(-650 0)">  
  <animateTransform   
    attributeName="transform"   
    type="translate"   
    values="-650 0; -640 0; -520 -2; -500 0; -350 -3; -330 0; -180 -2; -160 0; 0 -2; 0 0"   
    keyTimes="0; 0.08; 0.25; 0.35; 0.52; 0.62; 0.78; 0.86; 0.96; 1"  
    dur="5.5s"   
    begin="3.0s"   
    fill="freeze"/> 
  <g transform="rotate(-1.2 500 180)">  
    <animateTransform   
      attributeName="transform"   
      type="rotate"   
      values="-1.2 500 180; -1.2 500 180; 0 500 180"   
      keyTimes="0; 0.95; 1"   
      dur="8.8s"   
      fill="freeze"/>  
  
    <g>  
      <rect x="120" y="180" width="760" height="12" rx="6" fill="#0B1E3A" stroke="#60A5FA" stroke-width="1.5" filter="url(#glow)"/>  
      <line x1="140" y1="198" x2="860" y2="198" stroke="#2563EB" stroke-width="2" opacity=".6"/>  
      <circle cx="875" cy="186" r="4" fill="none" stroke="#60A5FA" stroke-width="2"/>  
  
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;.95;1" dur="9.2s" fill="freeze"/>  
      <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 0.2 0" keyTimes="0;.95;1" dur="9.2s" fill="freeze"/>  
    </g>  
  
    <g>  
      <text class="main" x="500" y="165" text-anchor="middle">TEMITOPE</text>  
          
      <animateTransform   
        attributeName="transform"   
        type="translate"   
        values="0 0; 0 0; 0 8"   
        keyTimes="0; 0.93; 1"   
        dur="9.0s"   
        fill="freeze"/>  
    </g>  
  </g>  
</g>  
  
<g>  
  <path d="M 225 182 L 315 130" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">  
    <animate attributeName="d"   
      values="M 225 182 L 315 130; M 235 182 L 325 130; M 355 180 L 445 128; M 375 182 L 465 130; M 525 179 L 615 127; M 545 182 L 635 130; M 715 180 L 805 128; M 735 182 L 825 130; M 875 180 L 965 128; M 875 186 L 965 134"   
      keyTimes="0; 0.08; 0.25; 0.35; 0.52; 0.62; 0.78; 0.86; 0.96; 1"  
      dur="5.5s"   
      begin="3.0s"   
      fill="freeze"/>  
  
    
    <animate attributeName="d"   
      to="M 875 186 Q 910 220 935 228"   
      dur="0.4s"   
      begin="8.5s"   
      fill="freeze"/>  
  
    
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;.96;1" dur="9.0s" fill="freeze"/>  
  </path>  
</g>  
  
<g transform="translate(-650 0)">  
  <animateTransform   
    attributeName="transform"   
    type="translate"   
    values="-650 0; -640 0; -520 0; -500 0; -350 0; -330 0; -180 0; -160 0; 0 0; 0 0"   
    keyTimes="0; 0.08; 0.25; 0.35; 0.52; 0.62; 0.78; 0.86; 0.96; 1"  
    dur="5.5s"   
    begin="3.0s"   
    fill="freeze"/>  
  
  <g opacity="1">  
    <animate attributeName="opacity" to="0" dur="0.1s" begin="8.5s" fill="freeze"/>  
  
    <g stroke="#60A5FA" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">  
    
      <circle cx="965" cy="120" r="7" fill="#081426"/>  
      <path d="M 960 126 L 940 150"/>
        
      <path d="M 955 132 L 968 130 L 960 138"/>  
    
      <path d="M 940 150 L 950 170 L 960 188"/>  

      <path d="M 940 150 L 920 168 L 900 188">  
        <animate attributeName="d"   
          values="M 940 150 L 920 168 L 900 188; M 940 150 L 915 165 L 910 188; M 940 150 L 920 168 L 900 188"   
          dur="0.6s"   
          begin="3.0s"  
          repeatCount="9"/>  
      </path>  
    </g>  
  </g>  
  
  <g opacity="0" stroke="#60A5FA" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">  
    <animate attributeName="opacity" to="1" dur="0.2s" begin="8.5s" fill="freeze"/>  
    
    <circle cx="965" cy="184" r="6.5" fill="#081426"/>  
    <path d="M 958 188 L 935 188 L 910 188"/>
    <path d="M 945 188 L 935 178 L 920 188"/>
    <path d="M 910 188 L 895 188 L 875 188"/> 
  </g>  
</g>  

<g>  
  <circle cx="140" cy="145" r="1.5" fill="#60A5FA">  
    <animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/>  
  </circle>  
  <circle cx="850" cy="125" r="1.2" fill="#60A5FA">  
    <animate attributeName="opacity" values="1;.15;1" dur="3.2s" repeatCount="indefinite"/>  
  </circle>  
  <rect x="300" y="268" width="400" height="1" fill="url(#blue)" opacity=".25">  
    <animate attributeName="opacity" values=".15;.5;.15" dur="3s" repeatCount="indefinite"/>  
  </rect>  
</g>  
  
</svg>
