<svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg"> 
 
  <defs> 
 
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"> 
      <stop offset="0%" stop-color="#05070B"/> 
      <stop offset="50%" stop-color="#0B101A"/> 
      <stop offset="100%" stop-color="#040509"/> 
    </linearGradient> 
 
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%"> 
      <stop offset="0%" stop-color="#2563EB"/> 
      <stop offset="50%" stop-color="#60A5FA"/> 
      <stop offset="100%" stop-color="#2563EB"/> 
    </linearGradient> 
 
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%"> 
      <stop offset="0%" stop-color="#E2E8F0"/> 
      <stop offset="50%" stop-color="#FFFFFF"/> 
      <stop offset="100%" stop-color="#CBD5E1"/> 
    </linearGradient> 
 
    <filter id="glow"> 
      <feGaussianBlur stdDeviation="7" result="blur"/> 
      <feMerge> 
        <feMergeNode in="blur"/> 
        <feMergeNode in="SourceGraphic"/> 
      </feMerge> 
    </filter> 
 
    <filter id="softGlow"> 
      <feGaussianBlur stdDeviation="18"/> 
    </filter> 
 
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"> 
      <path 
        d="M50 0H0V50" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.025" 
      /> 
    </pattern> 
 
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%"> 
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/> 
      <stop offset="45%" stop-color="#60A5FA" stop-opacity="0.15"/> 
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/> 
      <stop offset="55%" stop-color="#60A5FA" stop-opacity="0.15"/> 
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/> 
    </linearGradient> 
 
    <clipPath id="textClip"> 
      <text 
        x="500" 
        y="154" 
        text-anchor="middle" 
        font-family="Segoe UI, Inter, Arial, sans-serif" 
        font-size="68" 
        font-weight="700" 
        letter-spacing="9" 
      > 
        TEMITOPE 
      </text> 
    </clipPath> 
 
    <style> 
 
      .mainText { 
        animation: 
          revealText 1.4s cubic-bezier(.16,1,.3,1) forwards, 
          breathe 5s ease-in-out 2.2s infinite; 
        transform-origin: 500px 145px; 
      } 
 
      .ghost { 
        animation: ghostIn 1.5s ease-out forwards; 
      } 
 
      .subtitle { 
        animation: subtitleIn 1s ease-out 1.5s forwards; 
        opacity: 0; 
      } 
 
      .scanner { 
        animation: scan 2.2s cubic-bezier(.65,0,.35,1) 0.5s forwards; 
      } 
 
      .scannerGlow { 
        animation: scanGlow 2.2s cubic-bezier(.65,0,.35,1) 0.5s forwards; 
      } 
 
      .particle1 { 
        animation: particle 3s ease-in-out 1.7s infinite; 
      } 
 
      .particle2 { 
        animation: particle 4s ease-in-out 2s infinite; 
      } 
 
      .particle3 { 
        animation: particle 3.5s ease-in-out 2.3s infinite; 
      } 
 
      .ui { 
        animation: uiIn 1s ease-out 1.8s forwards; 
        opacity: 0; 
      } 
 
      .indicator { 
        animation: blink 2s ease-in-out 2s infinite; 
      } 
 
      @keyframes revealText { 
 
        0% { 
          opacity: 0; 
          transform: scale(1.18); 
          filter: blur(14px); 
          letter-spacing: 18px; 
        } 
 
        35% { 
          opacity: 0.65; 
          filter: blur(5px); 
        } 
 
        70% { 
          opacity: 1; 
          filter: blur(0); 
          letter-spacing: 11px; 
        } 
 
        100% { 
          opacity: 1; 
          transform: scale(1); 
          filter: blur(0); 
          letter-spacing: 9px; 
        } 
 
      } 
 
      @keyframes breathe { 
 
        0%, 100% { 
          transform: scale(1); 
        } 
 
        50% { 
          transform: scale(1.012); 
        } 
 
      } 
 
      @keyframes ghostIn { 
 
        0% { 
          opacity: 0; 
          letter-spacing: 20px; 
          filter: blur(10px); 
        } 
 
        45% { 
          opacity: 0.08; 
        } 
 
        100% { 
          opacity: 0.025; 
          letter-spacing: 9px; 
          filter: blur(0); 
        } 
 
      } 
 
      @keyframes subtitleIn { 
 
        0% { 
          opacity: 0; 
          transform: translateY(8px); 
        } 
 
        100% { 
          opacity: 1; 
          transform: translateY(0); 
        } 
 
      } 
 
      @keyframes scan { 
 
        0% { 
          transform: translateX(-70px); 
          opacity: 0; 
        } 
 
        10% { 
          opacity: 1; 
        } 
 
        90% { 
          opacity: 1; 
        } 
 
        100% { 
          transform: translateX(1070px); 
          opacity: 0; 
        } 
 
      } 
 
      @keyframes scanGlow { 
 
        0% { 
          transform: translateX(-100px); 
          opacity: 0; 
        } 
 
        15% { 
          opacity: 0.7; 
        } 
 
        85% { 
          opacity: 0.7; 
        } 
 
        100% { 
          transform: translateX(1100px); 
          opacity: 0; 
        } 
 
      } 
 
      @keyframes particle { 
 
        0%, 100% { 
          opacity: 0.15; 
          transform: translateY(0); 
        } 
 
        50% { 
          opacity: 0.9; 
          transform: translateY(-7px); 
        } 
 
      } 
 
      @keyframes uiIn { 
 
        0% { 
          opacity: 0; 
          transform: translateY(5px); 
        } 
 
        100% { 
          opacity: 1; 
          transform: translateY(0); 
        } 
 
      } 
 
      @keyframes blink { 
 
        0%, 100% { 
          opacity: 0.25; 
        } 
 
        50% { 
          opacity: 1; 
        } 
 
      } 
 
    </style> 
 
  </defs> 
 
  <rect 
    width="1000" 
    height="300" 
    fill="url(#bg)" 
  /> 
 
  <rect 
    width="1000" 
    height="300" 
    fill="url(#grid)" 
  /> 
 
  <ellipse 
    cx="500" 
    cy="140" 
    rx="330" 
    ry="105" 
    fill="#2563EB" 
    opacity="0.055" 
    filter="url(#softGlow)" 
  /> 
 
  <text 
    class="ghost" 
    x="500" 
    y="154" 
    text-anchor="middle" 
    font-family="Segoe UI, Inter, Arial, sans-serif" 
    font-size="68" 
    font-weight="700" 
    letter-spacing="9" 
    fill="#60A5FA" 
  > 
    TEMITOPE 
  </text> 
 
  <circle 
    class="particle1" 
    cx="145" 
    cy="108" 
    r="2" 
    fill="#60A5FA" 
  /> 
 
  <circle 
    class="particle2" 
    cx="850" 
    cy="92" 
    r="1.5" 
    fill="#93C5FD" 
  /> 
 
  <circle 
    class="particle3" 
    cx="790" 
    cy="210" 
    r="2" 
    fill="#60A5FA" 
  /> 
 
  <circle 
    cx="210" 
    cy="215" 
    r="1" 
    fill="#60A5FA" 
    opacity="0.35" 
  /> 
 
  <circle 
    cx="890" 
    cy="145" 
    r="1" 
    fill="#93C5FD" 
    opacity="0.4" 
  /> 
 
  <g 
    class="ui" 
    font-family="Segoe UI, Inter, Arial, sans-serif" 
    fill="#64748B" 
  > 
 
    <text 
      x="72" 
      y="70" 
      font-size="10" 
      letter-spacing="3" 
    > 
      01 / PROFILE 
    </text> 
 
    <text 
      x="72" 
      y="84" 
      font-size="8" 
      letter-spacing="2" 
      fill="#334155" 
    > 
      IDENTITY 
    </text> 
 
    <text 
      x="928" 
      y="70" 
      text-anchor="end" 
      font-size="10" 
      letter-spacing="3" 
    > 
      2026 
    </text> 
 
    <text 
      x="928" 
      y="84" 
      text-anchor="end" 
      font-size="8" 
      letter-spacing="2" 
      fill="#334155" 
    > 
      BUILDING 
    </text> 
 
  </g> 
 
  <text 
    class="mainText" 
    x="500" 
    y="154" 
    text-anchor="middle" 
    font-family="Segoe UI, Inter, Arial, sans-serif" 
    font-size="68" 
    font-weight="700" 
    letter-spacing="9" 
    fill="url(#text)" 
  > 
    TEMITOPE 
  </text> 
 
  <rect 
    class="scannerGlow" 
    x="-100" 
    y="55" 
    width="80" 
    height="180" 
    fill="#60A5FA" 
    opacity="0" 
    filter="url(#softGlow)" 
  /> 
 
  <rect 
    class="scanner" 
    x="-70" 
    y="45" 
    width="1.5" 
    height="210" 
    fill="url(#scan)" 
    opacity="0" 
    filter="url(#glow)" 
  /> 
 
  <rect 
    x="375" 
    y="176" 
    width="250" 
    height="1.5" 
    rx="1" 
    fill="url(#blue)" 
    opacity="0.65" 
  > 
 
    <animate 
      attributeName="width" 
      values="80;250;190;250" 
      dur="4s" 
      begin="1.6s" 
      repeatCount="indefinite" 
    /> 
 
    <animate 
      attributeName="x" 
      values="460;375;405;375" 
      dur="4s" 
      begin="1.6s" 
      repeatCount="indefinite" 
    /> 
 
  </rect> 
 
  <text 
    class="subtitle" 
    x="500" 
    y="207" 
    text-anchor="middle" 
    font-family="Segoe UI, Inter, Arial, sans-serif" 
    font-size="13" 
    letter-spacing="5" 
    fill="#94A3B8" 
  > 
    SOFTWARE • CREATIVE • LEARNING 
  </text> 
 
  <g 
    class="ui" 
    font-family="Segoe UI, Inter, Arial, sans-serif" 
  > 
 
    <circle 
      class="indicator" 
      cx="463" 
      cy="238" 
      r="2.5" 
      fill="#60A5FA" 
    /> 
 
    <text 
      x="474" 
      y="241" 
      font-size="8" 
      letter-spacing="2" 
      fill="#64748B" 
    > 
      BUILDING 
    </text> 
 
  </g> 
 
  <line 
    x1="160" 
    y1="265" 
    x2="840" 
    y2="265" 
    stroke="url(#blue)" 
    stroke-width="1" 
    opacity="0.18" 
  /> 
 
  <path 
    d="M70 245V255H80" 
    fill="none" 
    stroke="#2563EB" 
    stroke-width="1" 
    opacity="0.45" 
  /> 
 
  <path 
    d="M930 245V255H920" 
    fill="none" 
    stroke="#2563EB" 
    stroke-width="1" 
    opacity="0.45" 
  /> 
 
</svg>